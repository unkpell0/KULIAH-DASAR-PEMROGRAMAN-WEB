<!DOCTYPE html>
<!-- Jobsheet 6: data dimuat dengan Fetch API dari file JSON (data/*.json). Jalankan lewat server lokal, bukan file://. -->
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SIFILM-Mini | Tambah Film</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Zilla+Slab:wght@500;600&display=swap">
    <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body>
    <!-- Top bar: hanya tampil di layar < lg, berisi tombol pembuka sidebar (offcanvas) -->
    <header class="navbar sticky-top d-lg-none bg-lamp" data-bs-theme="dark">
      <div class="container-fluid">
        <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebar"
                aria-controls="sidebar" aria-label="Buka menu">
          <span class="navbar-toggler-icon"></span>
        </button>
        <span class="navbar-brand font-head mb-0 me-auto ms-3">SIFILM-Mini</span>
      </div>
    </header>

    <div class="d-lg-flex min-vh-100">
      <!-- Sidebar: offcanvas di layar kecil, sidebar tetap di layar lg ke atas -->
      <aside id="sidebar" class="sidebar offcanvas-lg offcanvas-start" tabindex="-1"
             aria-labelledby="sidebar-title" data-bs-theme="dark">
        <div class="offcanvas-header">
          <h2 class="offcanvas-title sidebar-brand" id="sidebar-title"><span class="brand-mark">S</span>SIFILM-Mini</h2>
          <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#sidebar" aria-label="Tutup menu"></button>
        </div>
        <div class="offcanvas-body d-flex flex-column flex-grow-1 p-0">
          <div class="sidebar-brand d-none d-lg-flex"><span class="brand-mark">S</span>SIFILM-Mini</div>
          <nav aria-label="Navigasi utama">
            <ul class="nav flex-column">
            <li class="nav-item"><a class="nav-link" href="../index.html"><i class="bi bi-house-door" aria-hidden="true"></i>Beranda</a></li>
            <li class="nav-item"><span class="nav-label">Film</span></li>
            <li class="nav-item"><a class="nav-link" href="../film/list.html"><i class="bi bi-film" aria-hidden="true"></i>Daftar Film</a></li>
            <li class="nav-item"><a class="nav-link active" aria-current="page" href="../film/tambah.html"><i class="bi bi-plus-square" aria-hidden="true"></i>Tambah Film</a></li>
            <li class="nav-item"><span class="nav-label">Anggota</span></li>
            <li class="nav-item"><a class="nav-link" href="../anggota/list.html"><i class="bi bi-people" aria-hidden="true"></i>Daftar Anggota</a></li>
            <li class="nav-item"><a class="nav-link" href="../anggota/tambah.html"><i class="bi bi-person-plus" aria-hidden="true"></i>Tambah Anggota</a></li>
            <li class="nav-item"><span class="nav-label">Desain</span></li>
            <li class="nav-item"><a class="nav-link" href="../docs/wireframe.html"><i class="bi bi-bounding-box" aria-hidden="true"></i>Wireframe</a></li>
            </ul>
          </nav>
          <p class="sidebar-foot mt-auto px-4 pt-4 pb-3 mb-0">Jobsheet 6 &middot; Fetch API &amp; JSON</p>
        </div>
      </aside>

      <div class="content-wrap d-flex flex-column flex-grow-1 min-w-0">
        <main class="flex-grow-1 p-3 p-md-4 p-xl-5">
          <div class="d-flex flex-wrap align-items-baseline justify-content-between gap-2 mb-3">
          <h1 class="h2 mb-0">Tambah Film</h1>
          <a class="fw-semibold link-success" href="list.html">Kembali ke daftar film</a>
          </div>
          <div class="card card-catalog form-card"><div class="card-body p-4">
              <form id="form-tambah" action="list.html" method="get">
                <div class="row mb-3">
                  <label for="judul" class="col-sm-3 col-form-label fw-semibold">Judul</label>
                  <div class="col-sm-9"><input type="text" class="form-control" id="judul" name="judul" placeholder="Contoh: Laskar Pelangi" required></div>
                </div>
                <div class="row mb-3">
                  <label for="sutradara" class="col-sm-3 col-form-label fw-semibold">Sutradara</label>
                  <div class="col-sm-9"><input type="text" class="form-control" id="sutradara" name="sutradara" list="daftar-sutradara" placeholder="Nama sutradara" required><datalist id="daftar-sutradara"><option value="Riri Riza"><option value="Gareth Evans"><option value="Christopher Nolan"><option value="Hayao Miyazaki"><option value="Bong Joon-ho"></datalist></div>
                </div>
                <div class="row mb-3">
                  <label for="tahun" class="col-sm-3 col-form-label fw-semibold">Tahun Rilis</label>
                  <div class="col-sm-9"><input type="number" class="form-control" id="tahun" name="tahun" min="1900" max="2026" placeholder="2008" required></div>
                </div>
                <div class="row mb-3">
                  <label for="durasi" class="col-sm-3 col-form-label fw-semibold">Durasi (menit)</label>
                  <div class="col-sm-9"><input type="number" class="form-control" id="durasi" name="durasi" min="1" placeholder="125" required></div>
                </div>
                <div class="row mb-3">
                  <label for="rating" class="col-sm-3 col-form-label fw-semibold">Rating (0-10)</label>
                  <div class="col-sm-9"><input type="number" class="form-control" id="rating" name="rating" min="0" max="10" step="0.1" placeholder="7.7" required></div>
                </div>
                <div class="row mb-3">
                  <label for="genre" class="col-sm-3 col-form-label fw-semibold">Genre</label>
                  <div class="col-sm-9"><select class="form-select" id="genre" name="genre" required><option value="">Pilih Genre</option><option value="action">Action</option><option value="animasi">Animasi</option><option value="drama">Drama</option><option value="komedi">Komedi</option><option value="sci-fi">Sci-fi</option><option value="thriller">Thriller</option></select></div>
                </div>
                <div class="d-flex justify-content-end gap-2 mt-4">
                  <button type="reset" class="btn btn-outline-secondary">Reset</button>
                  <button type="submit" class="btn btn-brass px-4">Simpan</button>
                </div>
              </form>
          </div></div>
        </main>
        <footer class="px-3 px-md-4 px-xl-5 py-3 text-secondary small">
          <p class="mb-0">&copy; 2026 SIFILM-Mini &mdash; Jobsheet 6</p>
        </footer>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/app.js"></script>
</body>
</html>
