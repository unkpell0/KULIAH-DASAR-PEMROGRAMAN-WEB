<!DOCTYPE html>
<!-- Jobsheet 6: data dimuat dengan Fetch API dari data/*.json. Jalankan lewat server lokal, bukan file://. -->
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIFILM-Mini | Tambah Film</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Zilla+Slab:wght@500;600&display=swap">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header>
      <p class="brand"><a href="../index.html">SIFILM-Mini</a></p>
    </header>

    <nav aria-label="Navigasi utama">
      <ul>
        <li><a href="../index.html">Beranda</a></li>
        <li><span>Film</span>
          <ul>
            <li><a href="../film/list.html">Daftar Film</a></li>
            <li><a href="../film/tambah.html" aria-current="page">Tambah Film</a></li>
          </ul>
        </li>
        <li><span>Anggota</span>
          <ul>
            <li><a href="../anggota/list.html">Daftar Anggota</a></li>
            <li><a href="../anggota/tambah.html">Tambah Anggota</a></li>
          </ul>
        </li>
        <li><span>Desain</span>
          <ul>
            <li><a href="../wireframe/index.html">Wireframe</a></li>
          </ul>
        </li>
      </ul>
    </nav>

    <main>
      <h1>Tambah Film</h1>
      <p><a class="page-action" href="list.html">Kembali ke daftar film</a></p>

      <section>
        <h2>Formulir Film Baru</h2>
        <form id="form-tambah" action="list.html" method="get">
          <fieldset>
            <legend>Detail film</legend>
            <p>
              <label for="judul">Judul</label>
              <input type="text" id="judul" name="judul" placeholder="Contoh: Laskar Pelangi" required>
            </p>
            <p>
              <label for="sutradara">Sutradara</label>
              <input type="text" id="sutradara" name="sutradara" list="daftar-sutradara" placeholder="Nama sutradara" required>
              <datalist id="daftar-sutradara"><option value="Riri Riza"><option value="Gareth Evans"><option value="Christopher Nolan"><option value="Hayao Miyazaki"><option value="Bong Joon-ho"></datalist>
            </p>
            <p>
              <label for="tahun">Tahun Rilis</label>
              <input type="number" id="tahun" name="tahun" min="1900" max="2026" placeholder="2008" required>
            </p>
            <p>
              <label for="durasi">Durasi (menit)</label>
              <input type="number" id="durasi" name="durasi" min="1" placeholder="125" required>
            </p>
            <p>
              <label for="rating">Rating (0-10)</label>
              <input type="number" id="rating" name="rating" min="0" max="10" step="0.1" placeholder="7.7" required>
            </p>
            <p>
              <label for="genre">Genre</label>
              <select id="genre" name="genre" required>
                <option value="">Pilih Genre</option>
                <option value="action">Action</option>
                <option value="animasi">Animasi</option>
                <option value="drama">Drama</option>
                <option value="komedi">Komedi</option>
                <option value="sci-fi">Sci-fi</option>
                <option value="thriller">Thriller</option>
              </select>
            </p>
          </fieldset>
          <p>
            <button type="reset">Reset</button>
            <button type="submit">Simpan</button>
          </p>
        </form>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 SIFILM-Mini &mdash; Jobsheet 6</p>
    </footer>
    <script src="../assets/js/app.js"></script>
</body>
</html>
