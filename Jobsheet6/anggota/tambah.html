      <ul>
        <li><a href="../index.html">Beranda</a></li>

    <main>
      <h1>Tambah Anggota</h1>
      <p><a class="page-action" href="list.html">Kembali ke daftar anggota</a></p>

      <section>
        <h2>Formulir Anggota Baru</h2>
        <form id="form-tambah" action="list.html" method="get">
          <fieldset>
            <legend>Detail anggota</legend>
            <p>
              <label for="nama">Nama</label>
              <input type="text" id="nama" name="nama" placeholder="Nama lengkap" required>
            </p>
            <p>
              <label for="no_anggota">No. Anggota</label>
              <input type="text" id="no_anggota" name="no_anggota" placeholder="A001" pattern="A[0-9]{3}" title="Huruf A diikuti 3 angka, contoh: A001" required>
            </p>
            <p>
              <label for="alamat">Alamat</label>
              <input type="text" id="alamat" name="alamat" placeholder="Kota / kecamatan">
            </p>
            <p>
              <label for="no_hp">No. HP</label>
              <input type="tel" id="no_hp" name="no_hp" placeholder="081234567890" pattern="08[0-9]{8,11}" title="Diawali 08, total 10-13 digit, contoh: 081234567890" required>
            </p>
          </fieldset>
          <p>
            <button type="reset">Reset</button>
            <button type="submit">Simpan</button>
          </p>
        </form>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 SIFILM-Mini &mdash; Jobsheet 6</p>
