<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SIMPUS-Mini | Tambah Buku</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>

  <body>
    <header>
      <h1>SIMPUS-Mini</h1>
      <button type="button" id="nav-toggle-btn" class="nav-toggle-label" aria-label="Menu">&#9776;</button>
      <nav>
        <ul>
          <li><a href="../index.html">Beranda</a></li>
          <li class="nav-item dropdown">
                    <!-- Tombol utama Dropdown -->
                    <a class="nav-link dropdown-toggle text-decoration-none" href="#" id="navbarDropdownBuku" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        Buku
                    </a>
                    <!-- Isi dari Dropdown -->
                    <ul class="dropdown-menu" aria-labelledby="navbarDropdownBuku">
                        <li><a class="dropdown-item" href="list.html">Daftar Buku</a></li>
                        <li><a class="dropdown-item active" href="tambah.html">Tambah Buku</a></li>
                    </ul>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle text-decoration-none" href="#" id="navbarDropdownAnggota" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        Anggota
                    </a>
                    <ul class="dropdown-menu" aria-labelledby="navbarDropdownAnggota">
                        <li><a class="dropdown-item" href="../anggota/list.html">Daftar Anggota</a></li>
                        <li><a class="dropdown-item" href="../anggota/tambah.html">Tambah Anggota</a></li>
                    </ul>
                </li>
        </ul>
      </nav>
    </header>

    <main>
      <section>
        <h2>Tambah Buku</h2>
        <form>
          <p>
            <label for="judul">Judul</label><br />
            <input type="text" id="judul" name="judul" required />
          </p>

          <p>
            <label for="pengarang">Pengarang</label><br />
            <input type="text" id="pengarang" name="pengarang" required />
          </p>

          <p>
            <label for="tahun">Tahun Terbit</label><br />
            <input
              type="number"
              id="tahun"
              name="tahun"
              min="1900"
              max="2026"
              required
            />
          </p>

          <p>
            <label for="isbn">ISBN</label><br />
            <input type="text" id="isbn" name="isbn" />
          </p>

          <p>
            <label for="stok">Stok</label><br />
            <input type="number" id="stok" name="stok" min="0" required />
          </p>

          <p>
            <label for="kategori">Kategori</label><br />
            <select name="kategori" id="kategori">
              <option value="">Pilih Kategori</option>
              <option value="fiksi">Fiksi</option>
              <option value="non-fiksi">Non-Fiksi</option>
              <option value="sains">Sains</option>
              <option value="sejarah">Sejarah</option>
              <option value="referensi">Referensi</option>
            </select>
          </p>

          <p>
            <button type="submit">Simpan</button>
          </p>
        </form>
      </section>
    </main>

    <footer>
      <p>&copy; 2024 SIMPUS-Mini &mdash; Jobsheet 5</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
